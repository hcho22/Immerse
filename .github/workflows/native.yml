name: Native validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # Validation in four parts side by side, each on its own runner (Scripts/validation-parts.sh says what each
  # holds). One job ran them in turn for about two hours.
  part:
    name: ${{ matrix.part }}
    strategy:
      fail-fast: false
      matrix:
        part: [packages, harness, ui-text, ui-flows]
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      IMMERSE_VALIDATE_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated simulators
        run: |
          create() { xcrun simctl create "$1" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "com.apple.CoreSimulator.SimRuntime.$2"; }
          case "$IMMERSE_VALIDATE_PART" in
            packages)
              echo "IMMERSE_SIMULATOR_UDID=$(create 'Immerse CI' iOS-26-5)" >> "$GITHUB_ENV"
              echo "IMMERSE_STOREKIT_SIMULATOR_UDID=$(create 'Immerse Billing CI' iOS-26-2)" >> "$GITHUB_ENV" ;;
            harness)
              echo "IMMERSE_WORKFLOW_SIMULATOR_UDID=$(create 'Immerse CI' iOS-26-5)" >> "$GITHUB_ENV" ;;
            *)
              echo "IMMERSE_SIMULATOR_UDID=$(create 'Immerse CI' iOS-26-5)" >> "$GITHUB_ENV" ;;
          esac
      - name: Validate
        run: sh Scripts/validate-local.sh
      - name: Retain native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-results-${{ matrix.part }}
          path: DerivedData/*.xcresult
  # The one check to read: green only when every part is.
  local-native:
    needs: part
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        run: |
          echo "Parts: ${{ needs.part.result }}"
          test "${{ needs.part.result }}" = success
