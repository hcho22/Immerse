name: SetupAccessibilityProbe
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 26.0
targets:
  SetupAccessibilityProbe:
    type: application
    platform: iOS
    sources:
      - Sources
      - ../../App/Immerse/Sources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.immerse.SetupAccessibilityProbe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  SetupAccessibilityProbeTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: SetupAccessibilityProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.immerse.SetupAccessibilityProbe.Tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SetupAccessibilityProbe:
    build:
      targets:
        SetupAccessibilityProbe: all
        SetupAccessibilityProbeTests: [test]
    test:
      targets: [SetupAccessibilityProbeTests]
      parallelizable: false
