name: NativeAdaptersCompileProbe
options:
  minimumXcodeGenVersion: 2.43.0
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 26.0
packages:
  NativeAdapters:
    path: ../../Packages/NativeAdapters
  CapturePipeline:
    path: ../../Packages/CapturePipeline
  RenderCore:
    path: ../../Packages/RenderCore
  FilmRuntime:
    path: ../../Packages/FilmRuntime
targets:
  NativeAdaptersCompileProbe:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Sources
    dependencies:
      - package: NativeAdapters
        product: NativeAdapters
      - package: CapturePipeline
        product: CapturePipeline
      - package: RenderCore
        product: RenderCore
      - package: FilmRuntime
        product: FilmRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.immerse.NativeAdaptersCompileProbe
        PRODUCT_NAME: NativeAdaptersCompileProbe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Native Adapters Compile Probe"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: 1
